<section class="table-demo" aria-labelledby="material-table-title">
  <header class="table-demo__header">
    <div>
      <p class="table-demo__eyebrow">Material Table baseline</p>
      <h1 id="material-table-title">Work items</h1>
    </div>
    <mat-paginator
      [length]="totalRecords"
      [pageSize]="25"
      [pageSizeOptions]="pageSizeOptions"
      showFirstLastButtons
      aria-label="Select work item page"
    />
  </header>

  <div class="table-demo__surface">
    <div class="table-demo__table-wrap">
      <table mat-table [dataSource]="dataSource" class="work-items-table">
        @for (column of displayedColumns; track column) {
          <ng-container [matColumnDef]="column" [sticky]="isFrozenColumn(column)">
            <th mat-header-cell *matHeaderCellDef>{{ getColumnLabel(column) }}</th>
            <td mat-cell *matCellDef="let workItem">{{ getCellValue(workItem, column) }}</td>
            <td mat-footer-cell *matFooterCellDef>{{ getFooterValue(column) }}</td>
          </ng-container>
        }

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        <tr mat-footer-row *matFooterRowDef="displayedColumns; sticky: true"></tr>
      </table>
    </div>
  </div>
</section>
